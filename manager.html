<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>视频下载任务与设置</title><style>body{max-width:880px;margin:32px auto;padding:20px;font:15px system-ui;color:#142741;background:#f4f6fa}section,article{background:white;padding:18px;border-radius:12px;margin:14px 0}label{display:block;margin:12px 0}button,input,select{font:inherit}button{margin:5px;padding:8px 14px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer}small{display:block;overflow-wrap:anywhere;color:#56657b}#status{color:#b33221}</style><h1>下载任务与设置</h1><section><h2>悬浮图标</h2><label>大小 <input id="size" type="range" min="36" max="64" value="48"> <output id="sizeValue"></output></label><label>闲置透明度 <input id="opacity" type="range" min="15" max="100" value="35"> <output id="opacityValue"></output></label><label>悬停展开延迟 <select id="delay"><option value="0">立即</option><option value="300">0.3 秒</option><option value="600">0.6 秒</option><option value="1000">1 秒</option></select></label><div id="sites"></div><button id="save">保存设置</button></section><h2>下载任务</h2><p>保留最近 100 个任务。关闭原网页后仍可查看；更换下载链接需要原视频页面保持打开。</p><p id="status" role="status"></p><label>搜索任务 <input id="search" type="search" placeholder="输入文件名或平台"></label><label>状态 <select id="filter"><option value="all">全部</option><option value="in_progress">下载中</option><option value="complete">已完成</option><option value="interrupted">已中断</option></select></label><button id="clearJobs">清除已结束记录</button><p>只清除插件任务记录，不删除文件；已下载标记仍保留。</p><main id="jobs"></main><script src="core.js"></script><script src="manager.js"></script></html>
